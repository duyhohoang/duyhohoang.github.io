<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="esp32-block-title esp32-block-desc"><rect width="1000" height="660" fill="#15151b"/><style>rect{stroke:#bd7898;stroke-width:1.5;fill:#211d28}.power-block rect{fill:#302637}.controller-block rect{fill:#202b37;stroke:#82adbe}text{fill:#fff;font:600 21px Arial,sans-serif}.block-file{font:14px Arial,sans-serif;fill:#c4bacf}.block-bus{font:15px Arial,sans-serif;fill:#ffabc7}.block-wires{stroke:#95bcd6;stroke-width:2}</style><title id="esp32-block-title">ESP32 Devkit system block diagram</title><desc id="esp32-block-desc">220VAC to 24VDC, 5VDC and 3.3VDC supply. SHT31, RTC and EEPROM connect to ESP WROOM 32D over I2C. SD card connects over SPI. Relay and RS485 connect to the controller.</desc><g class="block-wires" fill="none"><path d="M225 225H290V505H225M225 365H290M290 225H365M225 580H365M670 250H775M670 440H775"></path></g><g class="power-block"><rect x="30" y="30" width="940" height="90" rx="8"></rect><text x="52" y="65">220VAC → 24VDC → 5VDC → 3.3VDC</text><text class="block-file" x="52" y="96">Power.kicad_sch</text></g><g class="peripheral-block"><rect x="30" y="170" width="195" height="105" rx="8"></rect><text x="48" y="204">SHT31</text><text class="block-file" x="48" y="230">SHT31.kicad_sch</text><text class="block-bus" x="180" y="257">I2C</text></g><g class="peripheral-block"><rect x="30" y="295" width="195" height="105" rx="8"></rect><text x="48" y="329">RTC</text><text class="block-file" x="48" y="355">RTC.kicad_sch</text><text class="block-bus" x="180" y="382">I2C</text></g><g class="peripheral-block"><rect x="30" y="420" width="195" height="105" rx="8"></rect><text x="48" y="454">EEPROM</text><text class="block-file" x="48" y="480">EEPROM.kicad_sch</text><text class="block-bus" x="180" y="507">I2C</text></g><g class="peripheral-block"><rect x="30" y="545" width="195" height="105" rx="8"></rect><text x="48" y="579">SD CARD</text><text class="block-file" x="48" y="605">SDCARD.kicad_sch</text><text class="block-bus" x="180" y="632">SPI</text></g><g class="controller-block"><rect x="365" y="170" width="305" height="475" rx="10"></rect><text x="395" y="212">ESP WROOM 32D</text><text class="block-file" x="395" y="240">ESP32.kicad_sch</text><text class="block-bus" x="382" y="290">I2C</text><text class="block-bus" x="382" y="580">SPI</text><text class="block-bus" x="590" y="275">Relay</text><text class="block-bus" x="590" y="465">RS485</text></g><g class="peripheral-block"><rect x="775" y="200" width="195" height="105" rx="8"></rect><text x="795" y="238">RELAY</text><text class="block-file" x="795" y="270">Relay.kicad_sch</text></g><g class="peripheral-block"><rect x="775" y="390" width="195" height="105" rx="8"></rect><text x="795" y="428">RS485</text><text class="block-file" x="795" y="460">RS485.kicad_sch</text></g></svg>