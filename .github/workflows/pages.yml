name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'duyhohoang/duyhohoang.github.io'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      NEXT_PUBLIC_SITE_URL: https://duyhohoang.github.io
      NEXT_PUBLIC_CONTACT_EMAIL: hoangduy2206.ute@gmail.com
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Unit tests
        run: pnpm test
      - name: Build static website
        run: pnpm build
      - name: Verify exported pages and assets
        run: pnpm check:export
      - name: Upload website only
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    if: github.repository == 'duyhohoang/duyhohoang.github.io'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
